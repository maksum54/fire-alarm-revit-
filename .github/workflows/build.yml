name: Build Revit 2025 Add-in

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/FireAlarmAddin/FireAlarmAddin.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          $out = "src/FireAlarmAddin/bin/Release/net8.0-windows"
          New-Item -ItemType Directory -Force dist/FireAlarmAddin | Out-Null
          Copy-Item "$out/FireAlarmAddin.dll" dist/FireAlarmAddin/
          Copy-Item "$out/FireAlarmAddin.addin" dist/
          Compress-Archive -Path dist/* -DestinationPath FireAlarmAddin-Revit2025.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FireAlarmAddin-Revit2025
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FireAlarmAddin-Revit2025.zip
